<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REMEDINHOS 123 - painel cuidador</title>

    <!-- Se não estiver logado, volta pra tela de acesso (roda antes de desenhar a página) -->
    <script>
        if (!sessionStorage.getItem("remedinhos_usuario")) {
            location.replace("login.html");
        }
    </script>

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="Site.css" />
</head>
<body class="bg-slate-50 text-slate-800 font-sans pb-24 md:pb-0 md:pt-16">

    <!-- CABEÇALHO -->
    <header class="bg-indigo-600 text-white shadow-md fixed top-0 left-0 right-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-2">
                <i class="fa-solid fa-hand-holding-heart text-2xl"></i>
                <h1 class="text-xl font-bold">Remedinhos <span class="text-indigo-200 text-sm font-normal">123 (IOT)</span></h1>
            </div>
            <div class="flex items-center space-x-2">
                <div class="flex items-center space-x-2 bg-indigo-700 px-3 py-1.5 rounded-full text-sm">
                    <i class="fa-solid fa-user-nurse"></i>
                    <span id="nome-usuario">Cuidador</span>
                    <a href="index.html" class="bg-indigo-700 hover:bg-indigo-500 px-3 py-1.5 rounded-full text-sm transition" title="Voltar ao site">
                        <i class="fa-solid fa-house"></i>
                        <span class="hidden sm:inline ml-1">Site</span>
                    </a>                
                </div>
                <button onclick="sair()" class="bg-indigo-700 hover:bg-indigo-500 px-3 py-1.5 rounded-full text-sm cursor-pointer transition" title="Sair">
                    <i class="fa-solid fa-right-from-bracket"></i>
                    <span class="hidden sm:inline ml-1">Sair</span>
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto p-4 md:p-6 mt-14">

        <!-- ABA 1: AGENDA (visível por padrão) -->
        <section id="tab-agenda" class="space-y-4">
            <div class="flex justify-between items-center">
                <h2 class="text-xl font-bold text-slate-700"><i class="fa-solid fa-calendar-days text-indigo-600 mr-2"></i> Agenda de Horários</h2>
                <span class="text-xs bg-indigo-100 text-indigo-700 font-semibold px-2.5 py-1 rounded-full">Turno: Manhã</span>
            </div>
            <!-- O JavaScript preenche os cards aqui -->
            <div id="lista-agenda-dinamica" class="space-y-3"></div>
        </section>

        <!-- ABA 2: ALERTAS IoT -->
        <section id="tab-alertas" class="space-y-4 hidden"></section>

        <!-- ABA: HISTÓRICO (remédios concluídos e alertas resolvidos) -->
        <section id="tab-historico" class="space-y-4 hidden"></section>

        <!-- ABA 3: RESIDENTES -->
        <section id="tab-residentes" class="space-y-4 hidden">
            <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-3">
                <h2 class="text-xl font-bold text-slate-700"><i class="fa-solid fa-users text-indigo-600 mr-2"></i>Lista de Residentes</h2>
                <div class="w-full md:w-72 relative">
                    <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
                    <input type="text" id="busca-residentes" oninput="filtrarResidentes()" placeholder="Buscar por nome ou quarto..."
                    class="w-full bg-white border border-slate-200 rounded-xl pl-9 pr-4 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 shadow-sm">
                </div>
            </div>
            <div id="lista-residentes-cards" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>   
        </section>
    </main>

    <!-- MENU DE NAVEGAÇÃO -->
    <nav class="bg-white border-t border-slate-200 fixed bottom-0 left-0 right-0 md:top-14 md:bottom-auto md:border-b md:border-t-0 shadow-lg z-40">
        <div class="max-w-7xl mx-auto flex justify-around md:justify-start md:space-x-8 px-4 py-3">
            <button onclick="mudarAba('agenda')" id="btn-agenda" class="flex flex-col md:flex-row items-center md:space-x-2 text-indigo-600 font-medium text-xs md:text-sm cursor-pointer transition">
                <i class="fa-solid fa-calendar-day text-lg"></i>
                <span>Agenda</span>
            </button>
            <button onclick="mudarAba('alertas')" id="btn-alertas" class="relative flex flex-col md:flex-row items-center md:space-x-2 text-slate-500 hover:text-indigo-600 font-medium text-xs md:text-sm cursor-pointer transition">
                <i class="fa-solid fa-triangle-exclamation text-lg"></i>
                <span>Alertas IoT</span>
                <span id="badge-alertas" class="hidden absolute -top-1 -right-3 bg-red-500 text-white text-[10px] font-bold rounded-full min-w-4 h-4 px-1 flex items-center justify-center"></span>
            </button>
            <button onclick="mudarAba('historico')" id="btn-historico" class="flex flex-col md:flex-row items-center md:space-x-2 text-slate-500 hover:text-indigo-600 font-medium text-xs md:text-sm cursor-pointer transition">
                <i class="fa-solid fa-clock-rotate-left text-lg"></i>
                <span>Histórico</span>
            </button>
            <button onclick="mudarAba('residentes')" id="btn-residentes" class="flex flex-col md:flex-row items-center md:space-x-2 text-slate-500 hover:text-indigo-600 font-medium text-xs md:text-sm cursor-pointer transition">
                <i class="fa-solid fa-users text-lg"></i>
                <span>Residentes</span>
            </button>
        </div>
    </nav>

    <script src="Banco-de-Dados.js"></script>
</body>
</html>
