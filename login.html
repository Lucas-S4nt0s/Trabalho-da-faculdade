<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acesso - Remedinhos 123</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="Site.css" />
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen flex items-center justify-center p-4">

    <main class="w-full max-w-sm">
        <div class="text-center mb-6">
            <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-indigo-600 text-white text-2xl mb-3">
                <i class="fa-solid fa-hand-holding-heart"></i>
            </div>
            <h1 class="text-2xl font-bold">Remedinhos <span class="text-indigo-600 text-base font-normal">123 (IOT)</span></h1>
            <p class="text-sm text-slate-500 mt-1">Acesso do cuidador</p>
        </div>

        <form id="form-login" class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 space-y-4" novalidate>
            <div>
                <label for="usuario" class="block text-sm font-medium text-slate-700 mb-1">Usuário</label>
                <input id="usuario" name="usuario" type="text" autocomplete="username" autofocus
                       class="w-full border border-slate-200 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500">
            </div>

            <div>
                <label for="senha" class="block text-sm font-medium text-slate-700 mb-1">Senha</label>
                <div class="relative">
                    <input id="senha" name="senha" type="password" autocomplete="current-password"
                           class="w-full border border-slate-200 rounded-lg px-3 py-2 pr-11 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    <button type="button" id="btn-ver-senha" aria-label="Mostrar senha"
                            class="absolute right-2 top-1/2 -translate-y-1/2 text-slate-500 hover:text-indigo-600 px-2 cursor-pointer">
                        <i class="fa-solid fa-eye"></i>
                    </button>
                </div>
            </div>

            <p id="erro-login" role="alert" class="hidden text-sm text-red-600 bg-red-50 border border-red-200 rounded-lg px-3 py-2"></p>

            <button type="submit"
                    class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2.5 rounded-lg transition cursor-pointer">
                Entrar
            </button>

            <p class="text-xs text-slate-500 text-center">Demonstração: usuário <strong>cuidador</strong> / senha <strong>1234</strong></p>
        </form>
                <p class="text-center mt-4">
            <a href="index.html" class="text-sm text-slate-500 hover:text-indigo-600 transition">
                <i class="fa-solid fa-arrow-left mr-1"></i> Voltar ao site
            </a>
        </p>
    </main>

    <script>
        // Usuários SIMULADOS (só pra demonstração: em sistema real isso fica no servidor, com senha criptografada)
        const USUARIOS = [
            { usuario: "cuidador", senha: "1234", nome: "Cuidador(a) de plantão" },
            { usuario: "enfermeira", senha: "abcd", nome: "Enfermeira responsável" }
        ];

        // Se já está logado, vai direto pro painel
        if (sessionStorage.getItem("remedinhos_usuario")) {
            location.replace("SITE.html");
        }

        const form = document.getElementById("form-login");
        const campoUsuario = document.getElementById("usuario");
        const campoSenha = document.getElementById("senha");
        const erro = document.getElementById("erro-login");

        function mostrarErro(msg, campo) {
            erro.textContent = msg;
            erro.classList.remove("hidden");
            if (campo) campo.focus();
        }

        form.addEventListener("submit", (e) => {
            e.preventDefault();
            erro.classList.add("hidden");

            const usuario = campoUsuario.value.trim().toLowerCase();
            const senha = campoSenha.value;

            if (!usuario) return mostrarErro("Digite o usuário.", campoUsuario);
            if (!senha) return mostrarErro("Digite a senha.", campoSenha);

            const encontrado = USUARIOS.find(u => u.usuario === usuario && u.senha === senha);
            if (!encontrado) {
                campoSenha.value = "";
                return mostrarErro("Usuário ou senha incorretos.", campoSenha);
            }

            sessionStorage.setItem("remedinhos_usuario", encontrado.nome);
            location.href = "SITE.html";
        });

        document.getElementById("btn-ver-senha").addEventListener("click", (e) => {
            const mostrando = campoSenha.type === "text";
            campoSenha.type = mostrando ? "password" : "text";
            e.currentTarget.innerHTML = mostrando
                ? '<i class="fa-solid fa-eye"></i>'
                : '<i class="fa-solid fa-eye-slash"></i>';
            e.currentTarget.setAttribute("aria-label", mostrando ? "Mostrar senha" : "Ocultar senha");
        });
    </script>
</body>
</html>
